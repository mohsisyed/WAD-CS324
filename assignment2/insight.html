<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Insight</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>

<header>
    <div class="logo">VISION</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="wardrobe.html">Wardrobe</a>
        <a href="insight.html">New Insight</a>
    </nav>
</header>

<main>
    <h1>New Insight</h1>
    <p>Add a new item to your wardrobe.</p>

    <form class="upload-form">
        <label for="photo">Upload clothing photo</label>
        <input type="file" id="photo" accept="image/*">

        <label for="category">Category</label>
        <select id="category">
            <option>Shirts</option>
            <option>Pants</option>
            <option>Footwear</option>
            <option>Outerwear</option>
            <option>Accessories</option>
        </select>

        <label for="name">Item name</label>
        <input type="text" id="name" placeholder="Enter item name">

        <button type="button">Add to Wardrobe</button>
        <a href="wardrobe.html">Cancel</a>
    </form>
</main>


<footer>
    <p>© Vision Wardrobe</p>
</footer>

</body>
</html>
