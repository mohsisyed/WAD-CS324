
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAD-324 | Mohis Mujahid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
        }

        main {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section-title {
            margin-bottom: 25px;
            font-size: 24px;
        }

        .student-info {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #e2e8f0;
            line-height: 1.8;
        }

        .assignment-card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            max-width: 400px;
            transition: 0.3s;
        }

        .assignment-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .assignment-number {
            color: #2563eb;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .assignment-card h3 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        .assignment-card p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .assignment-link {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .assignment-link:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <main>

        <div class="student-info">
            <p><strong>Student Name:</strong> Mohis Mujahid</p>
            <p><strong>Registration Number:</strong> 3019</p>
            <p><strong>Course:</strong> WAD-324</p>
        </div>

        <h2 class="section-title">My Assignments</h2>

        <!-- Assignment 2 -->
        <div class="assignment-card">

            <div class="assignment-number">ASSIGNMENT 02</div>

            <h3>Assignment 2</h3>

            <p>
                View my Assignment 2 project and submission.
            </p>

            <a href="assignment2/index.html"
               class="assignment-link"

                View Assignment
